services:
  catalogo-service:
    build: ./catalogo-service
    container_name: catalogo_service
    restart: always
    ports:
      - "8217:3000"
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4000
      - CATALOG_PUBLIC_URL=http://localhost:8217
      - LOG_SERVICE_URL=http://log-service:5000
    networks:
      - app_network
    depends_on:
      - auth-service
      - log-service

  auth-service:
    build: ./auth-service
    container_name: auth_service
    restart: always
    env_file:
      - .env
    environment:
      - LOG_SERVICE_URL=http://log-service:5000
    networks:
      - app_network
    depends_on:
      - log-service

  log-service:
    build: ./log-service
    container_name: log_service
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - app_network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis_audit
    restart: always
    networks:
      - app_network
    volumes:
      - redis_data:/data

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
