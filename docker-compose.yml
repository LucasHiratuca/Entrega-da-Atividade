services:
  catalogo-service:
    build: ./catalogo-service
    image: lucashiratuca/catalogo-service:latest
    container_name: catalogo_service
    restart: always
    ports:
      - "8217:3000"
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4000
      - CATALOG_PUBLIC_URL=http://localhost:8217
      - LOG_SERVICE_URL=http://log-service:5000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=perfis
    networks:
      - app_network
    depends_on:
      - auth-service
      - log-service
      - minio

  auth-service:
    build: ./auth-service
    image: lucashiratuca/auth-service:latest
    container_name: auth_service
    restart: always
    env_file:
      - .env
    environment:
      - LOG_SERVICE_URL=http://log-service:5000
    networks:
      - app_network
    depends_on:
      - log-service

  log-service:
    build: ./log-service
    image: lucashiratuca/log-service:latest
    container_name: log_service
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - app_network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis_audit
    restart: always
    networks:
      - app_network
    volumes:
      - redis_data:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_perfis
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  minio_data: