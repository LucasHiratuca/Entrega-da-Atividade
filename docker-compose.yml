services:
  catalogo-service:
    build: ./catalogo-service
    container_name: catalogo_service
    restart: always
    ports:
      # Único ponto de entrada público — ajuste a porta conforme sua reserva no Portainer
      - "8217:3000"
    env_file:
      - .env
    environment:
      # Endereço interno do auth-service (resolvido pela rede Docker, nunca exposto)
      - AUTH_SERVICE_URL=http://auth-service:4000
      # URL pública usada nos links de e-mail de recuperação de senha
      - CATALOG_PUBLIC_URL=http://localhost:8217
    networks:
      - app_network
    depends_on:
      - auth-service

  auth-service:
    build: ./auth-service
    container_name: auth_service
    restart: always
    # Sem ports: — o auth-service não publica nenhuma porta para o host
    env_file:
      - .env
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
